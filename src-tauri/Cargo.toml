[package]
name = "liteclip"
version = "0.1.0"
description = "LiteClip - 轻量视频剪辑工具（Tauri + FFmpeg Sidecar）"
authors = ["LiteClip"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.3"
tauri-plugin-fs = "2.0.3"
tauri-plugin-shell = "2.0.2"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.41.1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
once_cell = "1.20.2"
which = "7.0.0"
regex = "1.11.1"
chrono = "0.4.38"

[lib]
name = "liteclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liteclip"
path = "src/main.rs"
